# Publica en CurseForge (flavor Forever) y Wago al subir una etiqueta vX.Y.Z.
# El packager se fija a un SHA de master: la etiqueta @v2 (2.6.1) no lleva los arreglos de Forever
# del 07-10-2026 (16001 en _Mainline.toc, rechazo de 16001 en _Classic.toc, GH_API_TOKEN).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Luacheck
        uses: lunarmodules/luacheck@v1.2.0

      - name: Python para los tests
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # tools/ lo copia nuevo-addon.ps1 desde la skill (probar_addon.py + mini_busted.lua).
      - name: Tests fuera del juego (Lua 5.1 y LuaJIT de lupa)
        run: |
          python -m pip install "lupa==2.8"
          python tools/probar_addon.py . --ambos

      - name: Package and upload
        uses: BigWigsMods/packager@457c47679b7b454dcf7ca44127c647116bc31dd8
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          # Ambos nombres: el nuevo (GH_API_TOKEN) y el que también entiende @v2 (GITHUB_API_TOKEN).
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
